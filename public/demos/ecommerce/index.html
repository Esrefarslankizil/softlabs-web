<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <title>MAISON ORVELLE — Haute Couture İstanbul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivory: #f6f1e9;
      --paper: #fbf8f3;
      --ink: #0e0d0c;
      --ink-soft: #2a2724;
      --muted: #7a7268;
      --gold: #b8975a;
      --gold-light: #d8c08f;
      --line: rgba(14, 13, 12, 0.12);
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Jost', -apple-system, 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @media (min-width: 500px) {
      body { box-shadow: 0 0 60px rgba(0,0,0,0.18); }
      html { background: #1a1816; }
    }

    ::-webkit-scrollbar { width: 0; height: 0; }
    button { font-family: inherit; }

    /* ---------- Announcement ---------- */
    .announce {
      background: var(--ink);
      color: var(--gold-light);
      font-size: 9.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-align: center;
      padding: 8px 12px;
      font-weight: 400;
    }

    /* ---------- Header ---------- */
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(251, 248, 243, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 10px 16px;
    }

    .hd-btn {
      background: none;
      border: none;
      color: var(--ink);
      cursor: pointer;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hd-left { justify-self: start; }
    .hd-right { justify-self: end; display: flex; gap: 2px; }

    .logo { text-align: center; line-height: 1; }
    .logo .maison {
      display: block;
      font-size: 8px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
      padding-left: 0.5em;
    }
    .logo .name {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 500;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      text-transform: uppercase;
    }

    .bag-badge {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--ink);
      color: var(--gold-light);
      font-size: 9px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      height: 470px;
      overflow: hidden;
      background: var(--ink);
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      transform: scale(1.04);
      animation: slowzoom 14s ease-in-out infinite alternate;
    }
    @keyframes slowzoom { to { transform: scale(1.12); } }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(14,13,12,0.15) 0%, rgba(14,13,12,0.1) 35%, rgba(14,13,12,0.82) 100%);
    }
    .hero-text {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0 24px 30px;
      z-index: 2;
      color: #fff;
      text-align: center;
    }
    .eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 22px;
      height: 1px;
      background: var(--gold-light);
      opacity: 0.7;
    }
    .hero-title {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.01em;
      margin-bottom: 8px;
    }
    .hero-title em { font-style: italic; color: var(--gold-light); }
    .hero-sub {
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }
    .btn-gold {
      background: transparent;
      border: 1px solid var(--gold-light);
      color: #fff;
      padding: 12px 28px;
      font-size: 10.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-gold:hover { background: var(--gold-light); color: var(--ink); }

    /* ---------- Categories ---------- */
    .cats {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 20px 12px 6px;
      overflow-x: auto;
    }
    .cat {
      background: none;
      border: none;
      padding: 8px 14px;
      font-size: 10.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .cat.active { color: var(--ink); font-weight: 500; }
    .cat.active::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 2px;
      width: 18px; height: 1px;
      background: var(--gold);
      transform: translateX(-50%);
    }

    /* ---------- Section ---------- */
    .section { padding: 18px 16px 8px; }
    .section-head { text-align: center; margin-bottom: 20px; }
    .section-head h2 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.1;
    }
    .section-head p {
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px 12px;
    }

    .card { cursor: pointer; animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .card-img {
      position: relative;
      aspect-ratio: 3 / 4.3;
      background: var(--ivory);
      overflow: hidden;
    }
    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:active .card-img img { transform: scale(1.04); }

    .tag {
      position: absolute;
      top: 10px; left: 10px;
      background: var(--paper);
      color: var(--ink);
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 8px;
      font-weight: 500;
    }
    .tag.dark { background: var(--ink); color: var(--gold-light); }

    .heart {
      position: absolute;
      top: 6px; right: 6px;
      width: 32px; height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
      transition: transform 0.2s;
    }
    .heart:active { transform: scale(1.25); }
    .heart.on { color: #e8c585; }
    .heart.on svg { fill: currentColor; }

    .card-body { padding: 11px 2px 0; text-align: center; }
    .card-cat {
      font-size: 8.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .card-name {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 5px;
      min-height: 39px;
    }
    .card-price { font-size: 12.5px; font-weight: 400; letter-spacing: 0.06em; color: var(--ink-soft); }
    .card-price s { color: var(--muted); margin-right: 6px; font-size: 11px; }

    /* ---------- Editorial band ---------- */
    .band {
      margin: 30px 0 6px;
      background: var(--ink);
      color: #fff;
      padding: 44px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .band::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(216, 192, 143, 0.35);
      pointer-events: none;
    }
    .band h3 {
      font-family: var(--serif);
      font-size: 31px;
      font-weight: 400;
      line-height: 1.1;
      margin: 10px 0 12px;
    }
    .band h3 em { color: var(--gold-light); }
    .band p {
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    /* ---------- Perks ---------- */
    .perks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--line);
      margin: 26px 16px 0;
      border: 1px solid var(--line);
    }
    .perk { background: var(--paper); padding: 18px 12px; text-align: center; }
    .perk b {
      display: block;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .perk span { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

    .footer {
      text-align: center;
      padding: 34px 20px 100px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 2;
    }
    .footer .fl { font-family: var(--serif); font-size: 20px; letter-spacing: 0.3em; color: var(--ink); margin-bottom: 4px; text-transform: uppercase; }

    /* ---------- Bottom Tab Bar ---------- */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(14, 13, 12, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 45;
      padding: 8px 0 10px;
      border-top: 1px solid rgba(216,192,143,0.25);
    }
    .tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
    }
    .tab.active { color: var(--gold-light); }
    .tab .tb {
      position: absolute;
      top: -3px;
      left: calc(50% + 5px);
      min-width: 14px; height: 14px;
      border-radius: 99px;
      background: var(--gold);
      color: var(--ink);
      font-size: 8.5px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
    }

    /* ---------- Overlay + Sheets ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 13, 12, 0.55);
      backdrop-filter: blur(3px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      max-height: 92%;
      background: var(--paper);
      z-index: 70;
      transform: translate(-50%, 102%);
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      border-radius: 18px 18px 0 0;
      overflow: hidden;
    }
    .sheet.open { transform: translate(-50%, 0); }

    .grabber { width: 38px; height: 4px; border-radius: 99px; background: var(--line); margin: 8px auto 0; flex-shrink: 0; }

    .sheet-scroll { overflow-y: auto; flex: 1; }

    .p-img { position: relative; height: 330px; background: var(--ivory); }
    .p-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .x-btn {
      position: absolute; top: 10px; right: 10px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(251,248,243,0.92);
      border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .p-body { padding: 20px 22px 8px; }
    .p-cat { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .p-name { font-family: var(--serif); font-size: 28px; font-weight: 500; line-height: 1.05; margin-bottom: 8px; }
    .p-price { font-size: 17px; letter-spacing: 0.05em; margin-bottom: 14px; }
    .p-price s { color: var(--muted); font-size: 13px; margin-left: 8px; }
    .p-desc { font-size: 12.5px; font-weight: 300; line-height: 1.75; color: var(--ink-soft); margin-bottom: 18px; }
    .lbl { font-size: 9.5px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; display: flex; justify-content: space-between; }
    .lbl i { font-style: normal; color: var(--gold); cursor: pointer; border-bottom: 1px solid var(--gold); }
    .sizes { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .sz {
      min-width: 46px; height: 42px; padding: 0 10px;
      background: transparent;
      border: 1px solid var(--line);
      font-size: 12px; letter-spacing: 0.08em;
      cursor: pointer; color: var(--ink);
      transition: all 0.2s;
    }
    .sz.on { background: var(--ink); color: var(--gold-light); border-color: var(--ink); }

    .details { border-top: 1px solid var(--line); }
    .details div {
      display: flex; justify-content: space-between;
      padding: 11px 0; border-bottom: 1px solid var(--line);
      font-size: 11px; letter-spacing: 0.04em;
    }
    .details span:first-child { color: var(--muted); text-transform: uppercase; letter-spacing: 0.18em; font-size: 9.5px; }

    .sheet-foot { padding: 14px 22px 22px; border-top: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
    .btn-ink {
      width: 100%;
      background: var(--ink);
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s;
    }
    .btn-ink:hover { background: var(--ink-soft); }
    .btn-ink.done { background: var(--gold); color: var(--ink); }
    .btn-line {
      width: 100%;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 13px;
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
    }

    /* ---------- Bag ---------- */
    .bag-head { padding: 14px 22px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .bag-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 500; font-style: italic; }
    .bag-head button { background: none; border: none; font-size: 18px; cursor: pointer; }
    .bag-note { background: var(--ivory); padding: 10px 22px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); text-align: center; }

    .bag-list { padding: 6px 22px; }
    .bi { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .bi img { width: 76px; height: 104px; object-fit: cover; background: var(--ivory); }
    .bi-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .bi-name { font-family: var(--serif); font-size: 17px; font-weight: 500; line-height: 1.15; }
    .bi-meta { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .bi-row { display: flex; justify-content: space-between; align-items: center; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); }
    .qty button { width: 28px; height: 28px; background: none; border: none; cursor: pointer; font-size: 14px; }
    .qty span { min-width: 22px; text-align: center; font-size: 12px; }
    .bi-price { font-size: 13px; letter-spacing: 0.05em; }

    .empty { text-align: center; padding: 60px 30px; }
    .empty .e-t { font-family: var(--serif); font-size: 24px; font-style: italic; margin-bottom: 8px; }
    .empty p { font-size: 11.5px; color: var(--muted); line-height: 1.7; }

    .tot { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .tot b { font-family: var(--serif); font-size: 26px; color: var(--ink); letter-spacing: 0.02em; font-weight: 600; text-transform: none; }
    .tot-sub { font-size: 10px; color: var(--muted); margin-bottom: 14px; letter-spacing: 0.06em; }

    .success { text-align: center; padding: 50px 28px; }
    .success .ring {
      width: 64px; height: 64px; border-radius: 50%;
      border: 1px solid var(--gold);
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 20px;
    }
    .success h4 { font-family: var(--serif); font-size: 30px; font-weight: 400; font-style: italic; margin-bottom: 10px; }
    .success p { font-size: 12px; line-height: 1.8; color: var(--ink-soft); font-weight: 300; margin-bottom: 22px; }
    .success .ord { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: var(--gold-light);
      padding: 11px 20px;
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      white-space: nowrap;
      border: 1px solid rgba(216,192,143,0.4);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <div class="announce">Ücretsiz Kargo · Hediye Paketi · 30 Gün İade</div>

  <header class="header">
    <div class="hd-left">
      <button class="hd-btn" onclick="toast('Menü · Demo')" aria-label="Menü">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 8h18M3 16h12"/></svg>
      </button>
    </div>
    <div class="logo">
      <span class="maison">Maison</span>
      <span class="name">Orvelle</span>
    </div>
    <div class="hd-right">
      <button class="hd-btn" onclick="switchTab('fav')" aria-label="Favoriler">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 20s-7-4.4-9-9.2C1.7 7.5 3.9 4.5 7 4.5c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.100 0 5.300 3 4 6.300C19 15.600 12 20 12 20z"/></svg>
      </button>
      <button class="hd-btn" onclick="openBag()" aria-label="Çanta">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
        <span class="bag-badge" id="hdBadge">0</span>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab active" id="tab-home" onclick="switchTab('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 11l8-7 8 7v9H4z"/></svg>
      Vitrin
    </button>
    <button class="tab" id="tab-fav" onclick="switchTab('fav')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 20s-7-4.4-9-9.2C1.7 7.5 3.9 4.5 7 4.5c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.100 0 5.300 3 4 6.300C19 15.600 12 20 12 20z"/></svg>
      Favoriler
      <span class="tb" id="favBadge" style="display:none">0</span>
    </button>
    <button class="tab" id="tab-bag" onclick="openBag()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      Çanta
      <span class="tb" id="bagBadge" style="display:none">0</span>
    </button>
  </nav>

  <div class="overlay" id="overlay" onclick="closeAll()"></div>
  <section class="sheet" id="pSheet"></section>
  <section class="sheet" id="bSheet"></section>
  <div class="toast" id="toastEl"></div>

  <script>
    const IMG = (id, w) => 'https://images.unsplash.com/photo-' + id + '?auto=format&fit=crop&w=' + (w || 700) + '&q=80';

    const PRODUCTS = [
      { id: 1, cat: 'erkek', catLabel: 'Erkek · Takım Elbise', name: 'Verona Mavi Kareli Üç Parça Takım', price: 38900, old: null, tag: 'Yeni', dark: false,
        img: IMG('1594938298603-c8148c4dae35'), sizes: ['48','50','52','54'],
        desc: 'İtalyan Super 120’s yün karışımı, el yapımı yaka ve astar. Üç parça klasik kesim; ceket, yelek ve pantolon bir arada.',
        det: [['Kumaş','%100 Super 120’s Yün'],['Kalıp','Slim Tailored'],['Üretim','İstanbul Atölyesi']] },
      { id: 2, cat: 'kadin', catLabel: 'Kadın · Elbise', name: 'Riviera İpek Kruvaze Elbise', price: 19800, old: null, tag: 'Sezon', dark: true,
        img: IMG('1496747611176-843222e1e57c'), sizes: ['34','36','38','40','42'],
        desc: 'Saf ipek şifon, bele oturan kruvaze yaka ve akışkan etek. Akdeniz akşamlarının zarif tercihi.',
        det: [['Kumaş','%100 Saf İpek'],['Kalıp','Wrap Midi'],['Bakım','Kuru Temizleme']] },
      { id: 3, cat: 'canta', catLabel: 'Aksesuar · Çanta', name: 'Vesper Deri Top-Handle Çanta', price: 42000, old: null, tag: 'Sınırlı', dark: true,
        img: IMG('1584917865442-de89df76afd3'), sizes: ['Tek Ebat'],
        desc: 'Bitkisel tabaklanmış buzağı derisi, el işçiliği altın kaplama kilit ve süet iç astar. Seri numaralı üretim.',
        det: [['Malzeme','İtalyan Buzağı Derisi'],['Ölçü','26 × 20 × 11 cm'],['Seri','No. 0148 / 300']] },
      { id: 4, cat: 'kadin', catLabel: 'Kadın · Dış Giyim', name: 'Azure Kaşmir Karışımlı Palto', price: 32400, old: 36900, tag: '-%12', dark: false,
        img: IMG('1539109136881-3be0616acf4b'), sizes: ['34','36','38','40'],
        desc: 'Yumuşak kaşmir yün karışımı, uzun kesim ve çift cep detayı. Soğuk günlerin en sofistike katmanı.',
        det: [['Kumaş','%70 Yün %30 Kaşmir'],['Kalıp','Relaxed Long'],['Renk','Azure Blue']] },
      { id: 5, cat: 'erkek', catLabel: 'Erkek · Blazer', name: 'Camel Yumuşak Omuzlu Blazer', price: 21900, old: null, tag: 'Yeni', dark: false,
        img: IMG('1552374196-1ab2a1c593e8'), sizes: ['48','50','52','54'],
        desc: 'Astarsız, doğal omuz hattı. Keten-yün karışımı kumaşıyla günlük zarafetin yeni tanımı.',
        det: [['Kumaş','Keten · Yün'],['Kalıp','Soft Construction'],['Renk','Camel']] },
      { id: 6, cat: 'kadin', catLabel: 'Kadın · Abiye', name: 'Bordeaux Saten Omuz Açık Gece Elbisesi', price: 27500, old: null, tag: 'Gala', dark: true,
        img: IMG('1566174053879-31528523f8ae'), sizes: ['34','36','38','40'],
        desc: 'Ağır saten, heykelsi omuz hattı ve vücuda oturan siluet. Özel davetler için tasarlandı.',
        det: [['Kumaş','Çift Kat Saten'],['Kalıp','Sheath Gown'],['Renk','Bordeaux']] },
      { id: 7, cat: 'erkek', catLabel: 'Erkek · Takım Elbise', name: 'Sartoria Lacivert Tek Sıra Düğmeli Takım', price: 34200, old: null, tag: 'Atölye', dark: true,
        img: IMG('1507679799987-c73779587ccf'), sizes: ['48','50','52','54','56'],
        desc: 'Lacivert yün gabardin, zarif revers ve ayarlanabilir kemer yapısı. İş ve davet için çok yönlü.',
        det: [['Kumaş','Yün Gabardin'],['Kalıp','Modern Classic'],['Üretim','İstanbul Atölyesi']] },
      { id: 8, cat: 'erkek', catLabel: 'Erkek · Takım Elbise', name: 'Marlowe Klasik Lacivert Takım', price: 29800, old: 33500, tag: '-%11', dark: false,
        img: IMG('1617137968427-85924c800a22'), sizes: ['48','50','52'],
        desc: 'Bol cepli klasik takım; saten yaka ve ince çizgi kumaş. İş dünyasının güçlü duruşu.',
        det: [['Kumaş','Yün · İpek'],['Kalıp','Regular Fit'],['Renk','Navy']] }
    ];

    let cat = 'all';
    let tab = 'home';
    const favs = new Set([3]);
    const sel = {};
    let bag = [{ id: 5, size: '50', qty: 1 }];
    let t;

    const fmt = n => '₺' + n.toLocaleString('tr-TR');
    const $ = id => document.getElementById(id);

    function heartSvg() {
      return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.4-9-9.2C1.700 7.500 3.900 4.500 7 4.500c2 0 3.700 1.100 5 3 1.300-1.900 3-3 5-3 3.100 0 5.300 3 4 6.300C19 15.600 12 20 12 20z"/></svg>';
    }

    function cardHTML(p, i) {
      return '<article class="card" style="animation-delay:' + (i * 70) + 'ms" onclick="openProduct(' + p.id + ')">' +
        '<div class="card-img">' +
          '<span class="tag ' + (p.dark ? 'dark' : '') + '">' + p.tag + '</span>' +
          '<button class="heart ' + (favs.has(p.id) ? 'on' : '') + '" onclick="event.stopPropagation(); toggleFav(' + p.id + ')" aria-label="Favori">' + heartSvg() + '</button>' +
          '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy" />' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-cat">' + p.catLabel + '</div>' +
          '<div class="card-name">' + p.name + '</div>' +
          '<div class="card-price">' + (p.old ? '<s>' + fmt(p.old) + '</s>' : '') + fmt(p.price) + '</div>' +
        '</div></article>';
    }

    function render() {
      const view = $('view');
      if (tab === 'fav') {
        const list = PRODUCTS.filter(p => favs.has(p.id));
        view.innerHTML =
          '<section class="section" style="padding-top:34px;min-height:70vh">' +
            '<div class="section-head"><h2>Favorileriniz</h2><p>' + list.length + ' seçki</p></div>' +
            (list.length
              ? '<div class="grid">' + list.map(cardHTML).join('') + '</div>'
              : '<div class="empty"><div class="e-t">Henüz favori yok</div><p>Beğendiğiniz parçaların kalp ikonuna dokunarak<br/>kişisel seçkinizi oluşturun.</p></div>') +
          '</section>';
        updateBadges();
        return;
      }

      const list = PRODUCTS.filter(p => cat === 'all' || p.cat === cat);
      view.innerHTML =
        '<section class="hero">' +
          '<img src="' + IMG('1507679799987-c73779587ccf', 900) + '" alt="Maison Orvelle Sonbahar Kış 26" />' +
          '<div class="hero-text">' +
            '<div class="eyebrow">Sonbahar · Kış 2026</div>' +
            '<h1 class="hero-title">The Quiet<br/><em>Luxury</em> Edit</h1>' +
            '<p class="hero-sub">Sessiz zarafet. Kusursuz işçilik.</p>' +
            '<button class="btn-gold" onclick="document.getElementById(\'shop\').scrollIntoView({behavior:\'smooth\'})">Koleksiyonu Keşfet</button>' +
          '</div>' +
        '</section>' +
        '<div class="cats" id="shop">' +
          [['all','Tümü'],['kadin','Kadın'],['erkek','Erkek'],['canta','Çanta']].map(function (c) {
            return '<button class="cat ' + (cat === c[0] ? 'active' : '') + '" onclick="setCat(\'' + c[0] + '\')">' + c[1] + '</button>';
          }).join('') +
        '</div>' +
        '<section class="section">' +
          '<div class="section-head"><h2>Seçki</h2><p>' + list.length + ' parça</p></div>' +
          '<div class="grid">' + list.map(cardHTML).join('') + '</div>' +
        '</section>' +
        '<section class="band">' +
          '<div class="eyebrow" style="margin-bottom:0">Atelier</div>' +
          '<h3>Size Özel <em>Ölçü</em><br/>& Dikim</h3>' +
          '<p>Baş terzimizle özel randevu oluşturun.<br/>Kumaş, kalıp ve detayları birlikte tasarlayalım.</p>' +
          '<button class="btn-gold" onclick="toast(\'Randevu talebiniz alındı\')">Randevu Al</button>' +
        '</section>' +
        '<div class="perks">' +
          '<div class="perk"><b>Ücretsiz Kargo</b><span>Tüm siparişlerde</span></div>' +
          '<div class="perk"><b>Hediye Paketi</b><span>Maison kutusunda</span></div>' +
          '<div class="perk"><b>30 Gün İade</b><span>Koşulsuz değişim</span></div>' +
          '<div class="perk"><b>Güvenli Ödeme</b><span>3D Secure · Taksit</span></div>' +
        '</div>' +
        '<footer class="footer"><div class="fl">Orvelle</div>Maison de Couture · İstanbul · Est. 1987<br/>Softlabs Commerce ile güçlendirildi</footer>';
      updateBadges();
    }

    function setCat(c) { cat = c; render(); document.getElementById('shop').scrollIntoView({ behavior: 'smooth' }); }

    function switchTab(t2) {
      tab = t2;
      $('tab-home').classList.toggle('active', t2 === 'home');
      $('tab-fav').classList.toggle('active', t2 === 'fav');
      closeAll();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleFav(id) {
      if (favs.has(id)) { favs.delete(id); toast('Favorilerden çıkarıldı'); }
      else { favs.add(id); toast('Favorilere eklendi'); }
      render();
    }

    function updateBadges() {
      const n = bag.reduce(function (a, b) { return a + b.qty; }, 0);
      $('hdBadge').textContent = n;
      $('hdBadge').style.display = n ? 'flex' : 'none';
      $('bagBadge').textContent = n;
      $('bagBadge').style.display = n ? 'flex' : 'none';
      $('favBadge').textContent = favs.size;
      $('favBadge').style.display = favs.size ? 'flex' : 'none';
    }

    /* ---- Product sheet ---- */
    function openProduct(id) {
      const p = PRODUCTS.find(function (x) { return x.id === id; });
      if (!sel[id]) sel[id] = p.sizes[Math.min(1, p.sizes.length - 1)];
      $('pSheet').innerHTML =
        '<div class="grabber"></div>' +
        '<div class="sheet-scroll">' +
          '<div class="p-img"><img src="' + IMG(p.img.split('photo-')[1].split('?')[0], 900) + '" alt="' + p.name + '"/>' +
          '<button class="x-btn" onclick="closeAll()">✕</button></div>' +
          '<div class="p-body">' +
            '<div class="p-cat">' + p.catLabel + '</div>' +
            '<div class="p-name">' + p.name + '</div>' +
            '<div class="p-price">' + fmt(p.price) + (p.old ? '<s>' + fmt(p.old) + '</s>' : '') + '</div>' +
            '<p class="p-desc">' + p.desc + '</p>' +
            '<div class="lbl"><span>Beden</span><i onclick="toast(\'Beden rehberi · Demo\')">Beden Rehberi</i></div>' +
            '<div class="sizes">' + p.sizes.map(function (s) {
              return '<button class="sz ' + (sel[id] === s ? 'on' : '') + '" onclick="pickSize(' + id + ',\'' + s + '\')">' + s + '</button>';
            }).join('') + '</div>' +
            '<div class="details">' + p.det.map(function (d) { return '<div><span>' + d[0] + '</span><span>' + d[1] + '</span></div>'; }).join('') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sheet-foot">' +
          '<button class="btn-ink" id="addBtn" onclick="addBag(' + id + ')">Çantaya Ekle · ' + fmt(p.price) + '</button>' +
          '<button class="btn-line" onclick="toast(\'Atelier randevusu oluşturuldu\')">Atelier’de Dene</button>' +
        '</div>';
      $('overlay').classList.add('open');
      $('pSheet').classList.add('open');
    }

    function pickSize(id, s) { sel[id] = s; openProduct(id); }

    function addBag(id) {
      const p = PRODUCTS.find(function (x) { return x.id === id; });
      const size = sel[id] || p.sizes[0];
      const ex = bag.find(function (b) { return b.id === id && b.size === size; });
      if (ex) ex.qty++; else bag.push({ id: id, size: size, qty: 1 });
      updateBadges();
      const btn = $('addBtn');
      if (btn) { btn.classList.add('done'); btn.textContent = '✓ Çantanıza Eklendi'; }
      setTimeout(function () { closeAll(); openBag(); }, 750);
    }

    /* ---- Bag sheet ---- */
    function openBag() {
      renderBag();
      $('pSheet').classList.remove('open');
      $('overlay').classList.add('open');
      $('bSheet').classList.add('open');
    }

    function renderBag() {
      const total = bag.reduce(function (a, b) { return a + PRODUCTS.find(function (p) { return p.id === b.id; }).price * b.qty; }, 0);
      let body;
      if (!bag.length) {
        body = '<div class="empty"><div class="e-t">Çantanız boş</div><p>Maison Orvelle seçkisinden<br/>size özel parçaları ekleyin.</p></div>';
      } else {
        body = '<div class="bag-list">' + bag.map(function (b, i) {
          const p = PRODUCTS.find(function (x) { return x.id === b.id; });
          return '<div class="bi"><img src="' + p.img + '" alt=""/>' +
            '<div class="bi-info"><div><div class="bi-name">' + p.name + '</div><div class="bi-meta">Beden ' + b.size + '</div></div>' +
            '<div class="bi-row"><div class="qty"><button onclick="qty(' + i + ',-1)">−</button><span>' + b.qty + '</span><button onclick="qty(' + i + ',1)">+</button></div>' +
            '<div class="bi-price">' + fmt(p.price * b.qty) + '</div></div></div></div>';
        }).join('') + '</div>';
      }

      $('bSheet').innerHTML =
        '<div class="grabber"></div>' +
        '<div class="bag-head"><h3>Çantanız</h3><button onclick="closeAll()">✕</button></div>' +
        '<div class="bag-note">✦ Ücretsiz kargo & hediye paketi dahil ✦</div>' +
        '<div class="sheet-scroll">' + body + '</div>' +
        (bag.length
          ? '<div class="sheet-foot"><div class="tot"><span>Toplam</span><b>' + fmt(total) + '</b></div>' +
            '<div class="tot-sub">KDV dahil · 12 aya varan taksit</div>' +
            '<button class="btn-ink" onclick="checkout()">Güvenli Ödemeye Geç</button>' +
            '<button class="btn-line" onclick="toast(\'WhatsApp sipariş özeti hazır\')">WhatsApp ile Sipariş Ver</button></div>'
          : '');
      updateBadges();
    }

    function qty(i, d) {
      bag[i].qty += d;
      if (bag[i].qty <= 0) bag.splice(i, 1);
      renderBag();
    }

    function checkout() {
      $('bSheet').innerHTML =
        '<div class="grabber"></div>' +
        '<div class="success"><div class="ring">✓</div>' +
        '<h4>Teşekkür Ederiz</h4>' +
        '<div class="ord">Sipariş No · ORV-2026-0481</div>' +
        '<p>Siparişiniz onaylandı. Parçalarınız Maison kutusunda,<br/>el yazısı notla özenle hazırlanıyor.<br/>Takip bağlantısı SMS ile iletildi.</p>' +
        '<button class="btn-ink" onclick="bag=[];updateBadges();closeAll();render();">Alışverişe Devam Et</button></div>';
    }

    function closeAll() {
      $('overlay').classList.remove('open');
      $('pSheet').classList.remove('open');
      $('bSheet').classList.remove('open');
    }

    function toast(m) {
      const el = $('toastEl');
      el.textContent = m;
      el.classList.add('show');
      clearTimeout(t);
      t = setTimeout(function () { el.classList.remove('show'); }, 2000);
    }

    render();
  </script>
</body>
</html>
